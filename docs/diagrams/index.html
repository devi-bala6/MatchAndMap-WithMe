<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Companion Diagrams</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: #0f172a; margin-bottom: 40px; }
        .diagram-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: #1d4ed8; }
        .mermaid {
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Travel Companion Matching App - Diagrams</h1>
        
        <div id="diagrams"></div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        const files = [
            { id: 'system', name: 'System Architecture', file: 'system_architecture.mmd' },
            { id: 'class', name: 'Class Diagram', file: 'class_diagram.mmd' },
            { id: 'activity', name: 'Activity Diagram', file: 'activity_diagram.mmd' },
            { id: 'usecase', name: 'Use Case Diagram', file: 'usecase_diagram.mmd' }
        ];

        async function loadDiagrams() {
            const container = document.getElementById('diagrams');
            
            for (const item of files) {
                try {
                    const response = await fetch(item.file);
                    const source = await response.text();
                    
                    const section = document.createElement('div');
                    section.className = 'diagram-section';
                    
                    const header = document.createElement('div');
                    header.className = 'header';
                    header.innerHTML = `
                        <h2>${item.name}</h2>
                        <button class="btn" onclick="downloadSVG('${item.id}-svg', '${item.name}')">Download SVG</button>
                    `;
                    
                    const renderDiv = document.createElement('div');
                    renderDiv.className = 'mermaid';
                    renderDiv.id = `${item.id}-svg`;
                    renderDiv.textContent = source;

                    section.appendChild(header);
                    section.appendChild(renderDiv);
                    container.appendChild(section);

                } catch(e) {
                    console.error("Failed to load " + item.file, e);
                }
            }
            
            await mermaid.run();
        }

        function downloadSVG(divId, filename) {
            const svgEl = document.querySelector(`#${divId} svg`);
            if (!svgEl) return alert('SVG not found!');
            
            const svgData = new XMLSerializer().serializeToString(svgEl);
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `${filename.replace(/ /g, '_')}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = loadDiagrams;
    </script>
</body>
</html>
